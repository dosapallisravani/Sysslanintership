<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EVENTORA | Live Events</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        EVENT<span>ORA</span>
    </a>

    <nav class="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="events.html">Events</a>
        <a href="booking.html">Booking</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <a href="signin.html" class="signin-btn">
        SIGN IN
    </a>

</header>


<main class="hero" id="hero">

    <!-- Dynamic Background -->
    <div class="hero-bg"></div>

    <div class="hero-overlay"></div>


    <!-- Decorative lights -->
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>


    <section class="carousel">


        <!-- LEFT PERFORMER -->

        <div class="side-card side-left">

            <img
                id="leftImage"
                src="images/sound-fest.png"
                alt="Previous performer"
            >

        </div>



        <!-- CENTER PERFORMER -->

        <div class="center-stage">


            <div class="stage-glow"></div>


            <div class="performer-3d">

                <div class="performer-shadow"></div>

                <img
                    id="centerImage"
                    src="images/neon-dj.png"
                    alt="Featured performer"
                >

            </div>



            <!-- EVENT INFORMATION -->

            <div class="event-content">

                <p class="eyebrow">
                    FEATURED EVENT
                </p>


                <h1 id="eventName">
                    NEON
                    <br>
                    <span>NIGHTS</span>
                </h1>


                <p id="eventType" class="event-type">
                    EDM LIVE EXPERIENCE
                </p>



                <!-- EVENT DETAILS -->

                <div class="details">

                    <div>
                        <small>DATE</small>
                        <strong id="eventDate">
                            18 SEP 2026
                        </strong>
                    </div>


                    <div>
                        <small>TIME</small>
                        <strong id="eventTime">
                            7:00 PM
                        </strong>
                    </div>


                    <div>
                        <small>VENUE</small>
                        <strong id="eventVenue">
                            HYDERABAD
                        </strong>
                    </div>


                    <div>
                        <small>PRICE</small>
                        <strong id="eventPrice">
                            ₹799
                        </strong>
                    </div>

                </div>



                <!-- BOOK BUTTON -->

                <a
                    href="booking.html"
                    id="bookButton"
                    class="primary-btn"
                >
                    BOOK TICKETS

                    <span>→</span>

                </a>

            </div>

        </div>



        <!-- RIGHT PERFORMER -->

        <div class="side-card side-right">

            <img
                id="rightImage"
                src="images/moon-guitarist.png"
                alt="Next performer"
            >

        </div>

    </section>



    <!-- PREVIOUS BUTTON -->

    <button
        class="arrow arrow-left"
        id="prevBtn"
        aria-label="Previous event"
    >
        ←
    </button>



    <!-- NEXT BUTTON -->

    <button
        class="arrow arrow-right"
        id="nextBtn"
        aria-label="Next event"
    >
        →
    </button>



    <!-- SLIDER -->

    <div class="slider-bottom">

        <div
            class="dots"
            id="dots"
        ></div>


        <span>
            SWIPE / DRAG TO EXPLORE
        </span>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
