<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EVENTORA — 3D Concert Experience</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<main class="hero" id="hero">

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            EVENT<span>ORA</span>
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#events">Events</a>
            <a href="#tickets">Booking</a>
            <a href="#about">About Us</a>
            <a href="#contact">Contact</a>
        </div>

        <button class="sign-btn">SIGN IN</button>

    </nav>


    <!-- Background -->
    <div class="background-glow"></div>
    <div class="particles"></div>


    <!-- 3D Performer Carousel -->
    <section class="event-carousel" id="events">

        <!-- Previous Performer -->
        <div class="side-event left-event" id="leftPerformer">

            <div class="performer-image">
                <img id="leftImage" src="" alt="Previous performer">
            </div>

        </div>


        <!-- CENTER PERFORMER -->
        <div class="center-event">

            <div class="performer">

                <img
                    id="centerImage"
                    src=""
                    alt="Featured performer"
                >

            </div>


            <!-- Event Information appears for center performer -->
            <div class="event-info" id="eventInfo">

                <div class="event-label">
                    FEATURED EVENT
                </div>

                <h1 id="eventName">
                    NEON<br>
                    <span>NIGHTS</span>
                </h1>

                <p class="event-type" id="eventType">
                    EDM LIVE EXPERIENCE
                </p>


                <div class="event-details">

                    <div>
                        <small>DATE</small>
                        <strong id="eventDate">18 SEP 2026</strong>
                    </div>

                    <div>
                        <small>TIME</small>
                        <strong id="eventTime">7:00 PM</strong>
                    </div>

                    <div>
                        <small>VENUE</small>
                        <strong id="eventVenue">HYDERABAD</strong>
                    </div>

                    <div>
                        <small>PRICE</small>
                        <strong id="eventPrice">₹799</strong>
                    </div>

                </div>

<button class="explore-btn" onclick="goToBooking()">
    BOOK TICKETS →
</button>

            </div>

        </div>


        <!-- Next Performer -->
        <div class="side-event right-event" id="rightPerformer">

            <div class="performer-image">
                <img id="rightImage" src="" alt="Next performer">
            </div>

        </div>

    </section>


    <!-- Carousel Buttons -->
    <button
        class="arrow left-arrow"
        onclick="previousEvent()"
        aria-label="Previous event">
        ←
    </button>

    <button
        class="arrow right-arrow"
        onclick="nextEvent()"
        aria-label="Next event">
        →
    </button>


    <!-- Bottom UI -->
    <div class="bottom-ui">

        <div class="slide-indicator" id="indicators">

            <span class="active"></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="scroll-text">
            SWIPE / SCROLL TO EXPLORE ↓
        </div>

    </div>
<!-- =========================
     BOOKING SECTION
========================= -->

<section class="booking-section" id="tickets">

    <div class="booking-container">

        <div class="booking-heading">
            <span>EVENTORA TICKETS</span>
            <h2>BOOK YOUR<br><strong>EXPERIENCE</strong></h2>
            <p>Reserve your spot and experience the event live.</p>
        </div>

        <form class="booking-form" id="bookingForm">

            <div class="form-row">

                <div class="form-group">
                    <label>FULL NAME</label>
                    <input type="text" id="fullName"
                           placeholder="Enter your name">
                    <small id="nameError"></small>
                </div>

                <div class="form-group">
                    <label>EMAIL</label>
                    <input type="email" id="email"
                           placeholder="Enter your email">
                    <small id="emailError"></small>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>PHONE NUMBER</label>
                    <input type="tel" id="phone"
                           placeholder="Enter phone number">
                    <small id="phoneError"></small>
                </div>

                <div class="form-group">
                    <label>SELECT EVENT</label>

                    <select id="selectedEvent">
                        <option value="">Choose an event</option>
                        <option value="Neon Nights">Neon Nights</option>
                        <option value="Moon Tunes">Moon Tunes</option>
                        <option value="Happy Beats">Happy Beats</option>
                        <option value="Beat World">Beat World</option>
                        <option value="City Beats">City Beats</option>
                        <option value="Sound Fest">Sound Fest</option>
                    </select>

                    <small id="eventError"></small>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>NUMBER OF TICKETS</label>

                    <select id="ticketCount">
                        <option value="">Select tickets</option>
                        <option value="1">1 Ticket</option>
                        <option value="2">2 Tickets</option>
                        <option value="3">3 Tickets</option>
                        <option value="4">4 Tickets</option>
                        <option value="5">5 Tickets</option>
                    </select>

                    <small id="ticketError"></small>
                </div>

                <div class="form-group">
                    <label>PAYMENT METHOD</label>

                    <select id="payment">
                        <option value="">Choose payment</option>
                        <option value="UPI">UPI</option>
                        <option value="Card">Credit / Debit Card</option>
                        <option value="Net Banking">Net Banking</option>
                    </select>

                    <small id="paymentError"></small>
                </div>

            </div>

            <button type="submit" class="book-now-btn">
                BOOK NOW →
            </button>

            <div id="bookingMessage"></div>

        </form>

    </div>

    </section>
</main>


<script src="script.js"></script>

</body>
    </html>
